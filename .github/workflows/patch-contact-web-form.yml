name: Patch RDG contact form

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-contact-web-form.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace mailto contact form with AJAX web form
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_form = '''  <form class="form" id="contactForm">
           <input required name="name" placeholder="Name" autocomplete="name">
           <input required type="email" name="email" placeholder="Email" autocomplete="email">
           <select name="projectType"><option value="">Project Type</option><option>Residential HVAC</option><option>Commercial HVAC</option><option>Mechanical Design</option><option>Design + Build</option><option>Heat Pump / Electrification</option><option>Other</option></select>
           <textarea required name="message" placeholder="Message"></textarea>
           <div class="form-status" id="formStatus"></div>
           <button class="send" type="submit">Send Message &nbsp;&nbsp;›</button>
          </form>'''

          new_form = '''  <form class="form" id="contactForm">
           <input required name="name" placeholder="Name" autocomplete="name">
           <input required type="email" name="email" placeholder="Email" autocomplete="email">
           <select name="projectType"><option value="">Project Type</option><option>Residential HVAC</option><option>Commercial HVAC</option><option>Mechanical Design</option><option>Design + Build</option><option>Heat Pump / Electrification</option><option>Other</option></select>
           <textarea required name="message" placeholder="Message"></textarea>
           <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
           <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
           <button class="send" id="sendButton" type="submit">Send Message &nbsp;&nbsp;›</button>
          </form>'''

          old_js = '''document.getElementById('contactForm').addEventListener('submit',function(e){
           e.preventDefault();
           const fd=new FormData(this);
           const subject='RDG Website Inquiry - '+(fd.get('projectType')||'General');
           const body='Name: '+fd.get('name')+'\\nEmail: '+fd.get('email')+'\\nProject Type: '+(fd.get('projectType')||'Not specified')+'\\n\\nMessage:\\n'+fd.get('message');
           document.getElementById('formStatus').textContent='Opening your email app to send the inquiry…';
           window.location.href='mailto:pak@radiantsf.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
          });'''

          new_js = '''document.getElementById('contactForm').addEventListener('submit',async function(e){
           e.preventDefault();
           const form=this;
           const fd=new FormData(form);
           const status=document.getElementById('formStatus');
           const button=document.getElementById('sendButton');

           // Simple spam trap. Human visitors never see this field.
           if(fd.get('_honey')){
            form.reset();
            status.textContent='Thank you. Your message has been sent.';
            return;
           }

           const payload={
            name:fd.get('name'),
            email:fd.get('email'),
            projectType:fd.get('projectType')||'Not specified',
            message:fd.get('message'),
            _subject:'RDG Website Inquiry - '+(fd.get('projectType')||'General'),
            _template:'table',
            _url:window.location.href,
            _honey:''
           };

           button.disabled=true;
           button.textContent='Sending…';
           status.textContent='Sending your message…';

           try{
            const response=await fetch('https://formsubmit.co/ajax/pak@radiantsf.com',{
             method:'POST',
             headers:{
              'Content-Type':'application/json',
              'Accept':'application/json'
             },
             body:JSON.stringify(payload)
            });
            const data=await response.json().catch(()=>({}));
            if(!response.ok || data.success===false){
             throw new Error(data.message||'Unable to send message');
            }
            form.reset();
            status.textContent='Thank you. Your message has been sent.';
           }catch(error){
            console.error(error);
            status.textContent='Sorry, your message could not be sent. Please try again.';
           }finally{
            button.disabled=false;
            button.innerHTML='Send Message &nbsp;&nbsp;›';
           }
          });'''

          if old_form not in s:
              raise SystemExit('Expected contact form block was not found')
          if old_js not in s:
              raise SystemExit('Expected mailto JavaScript block was not found')

          s = s.replace(old_form, new_form, 1).replace(old_js, new_js, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit updated website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Switch RDG contact form to web submission"
            git push
          fi
