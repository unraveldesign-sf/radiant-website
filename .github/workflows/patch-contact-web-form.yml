name: Patch RDG contact form

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-contact-web-form.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace mailto contact form with AJAX web form
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Add a hidden spam-trap field, accessible status message, and button id.
          s = s.replace(
              '<textarea required name="message" placeholder="Message"></textarea>\n   <div class="form-status" id="formStatus"></div>\n   <button class="send" type="submit">Send Message &nbsp;&nbsp;›</button>',
              '<textarea required name="message" placeholder="Message"></textarea>\n   <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">\n   <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>\n   <button class="send" id="sendButton" type="submit">Send Message &nbsp;&nbsp;›</button>',
              1
          )

          start_marker = "document.getElementById('contactForm').addEventListener('submit',function(e){"
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('Old contact form handler was not found')
          end_marker = '\n});\n</script>'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('End of old contact form handler was not found')
          end += len('\n});')

          new_js = """document.getElementById('contactForm').addEventListener('submit',async function(e){
           e.preventDefault();
           const form=this;
           const fd=new FormData(form);
           const status=document.getElementById('formStatus');
           const button=document.getElementById('sendButton');

           if(fd.get('_honey')){
            form.reset();
            status.textContent='Thank you. Your message has been sent.';
            return;
           }

           const payload={
            name:fd.get('name'),
            email:fd.get('email'),
            projectType:fd.get('projectType')||'Not specified',
            message:fd.get('message'),
            _subject:'RDG Website Inquiry - '+(fd.get('projectType')||'General'),
            _template:'table',
            _url:window.location.href,
            _honey:''
           };

           button.disabled=true;
           button.textContent='Sending…';
           status.textContent='Sending your message…';

           try{
            const response=await fetch('https://formsubmit.co/ajax/pak@radiantsf.com',{
             method:'POST',
             headers:{'Content-Type':'application/json','Accept':'application/json'},
             body:JSON.stringify(payload)
            });
            const data=await response.json().catch(()=>({}));
            if(!response.ok || data.success===false){
             throw new Error(data.message||'Unable to send message');
            }
            form.reset();
            status.textContent='Thank you. Your message has been sent.';
           }catch(error){
            console.error(error);
            status.textContent='Sorry, your message could not be sent. Please try again.';
           }finally{
            button.disabled=false;
            button.innerHTML='Send Message &nbsp;&nbsp;›';
           }
          });"""

          s = s[:start] + new_js + s[end:]
          if 'mailto:' in s:
              raise SystemExit('mailto handler is still present')
          if 'formsubmit.co/ajax/pak@radiantsf.com' not in s:
              raise SystemExit('AJAX form endpoint was not added')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit updated website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Switch RDG contact form to web submission"
            git push
          fi
