name: Fit RDG website to browser screen

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fit-browser-screen.yml

permissions:
  contents: write

jobs:
  patch-responsive-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add browser-fit responsive CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''*{box-sizing:border-box}
          html{scroll-behavior:smooth}
          body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;color:var(--ink);background:#fff;letter-spacing:.005em}
          a{color:inherit;text-decoration:none}
          button,input,select,textarea{font:inherit}
          .wrap{width:min(calc(100% - 72px),var(--max));margin:auto}'''.replace('          ','')

          new = '''*{box-sizing:border-box}
          html{scroll-behavior:smooth;width:100%;max-width:100%;overflow-x:hidden}
          body{margin:0;width:100%;max-width:100%;overflow-x:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;color:var(--ink);background:#fff;letter-spacing:.005em}
          img,svg{max-width:100%}
          a{color:inherit;text-decoration:none}
          button,input,select,textarea{font:inherit;max-width:100%}
          .wrap{width:min(calc(100% - clamp(28px,5vw,72px)),var(--max));margin:auto}'''.replace('          ','')

          if old not in s:
              raise SystemExit('Base layout CSS block not found')
          s = s.replace(old, new, 1)

          marker = '''@media(max-width:1050px){'''
          responsive = '''@media(max-width:1366px) and (min-width:781px){
           .header{height:88px;gap:24px}
           .rdg{font-size:50px}
           .brand{gap:18px;min-width:350px}
           .brand-name{font-size:18px}
           .brand-sub{font-size:10px}
           .nav{gap:26px}
           .contact-btn{min-width:116px;padding:12px 18px!important}
           .hero{min-height:100svh}
           .hero-grid{grid-template-columns:42% 58%;min-height:calc(100svh - 88px)}
           .hero-copy{padding:28px 18px 48px 0}
           .hero h1{font-size:clamp(36px,4vw,54px);line-height:1.1;margin-bottom:22px}
           .hero p{font-size:16px;line-height:1.55;margin-bottom:26px}
           .hero-art{height:min(470px,calc(100svh - 110px));margin-right:0}
           .hero-art img{right:0;width:112%}
           .service{padding-left:24px;padding-right:24px}
          }

          @media(max-height:720px) and (min-width:781px){
           .header{height:78px}
           .hero-grid{min-height:calc(100svh - 78px)}
           .hero-copy{padding-top:18px;padding-bottom:30px}
           .hero h1{font-size:clamp(34px,3.8vw,50px);margin-bottom:18px}
           .hero p{font-size:15px;line-height:1.45;margin-bottom:20px}
           .outline-btn{padding:13px 16px}
           .hero-art{height:min(430px,calc(100svh - 90px))}
          }

          '''
          if marker not in s:
              raise SystemExit('Responsive CSS marker not found')
          s = s.replace(marker, responsive + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit responsive layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Make RDG website fit browser screens"
            git push
          fi
